name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:ci-config
      - run: node --test test_tool/pwa_update_package.test.mjs
      - run: npm run build:headless-network
      - run: npm run test:unit
      - run: npm run build:windows
      - run: npm run test:electron-smoke
      - run: node test_tool/windows_mac_sync_smoke.mjs
      - run: node test_tool/windows_catalog_sync_smoke.mjs
      - run: npm run package:windows:portable
      - run: npm run test:windows:portable
      - run: node test_tool/windows_catalog_sync_smoke.mjs output/windows-portable/bundle/MathNotes-win32-x64/MathNotes.exe
      - run: npm run release:metadata
      - run: npm run test:public-source-gate

  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - run: .\apps\android\gradlew.bat -p apps\android testDebugUnitTest assembleDebug --no-daemon

  cross-platform-e2e-contract:
    runs-on: [self-hosted, Windows, mathnotes-android]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run test:android-windows-e2e
