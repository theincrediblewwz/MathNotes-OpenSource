name: Package macOS Native

on:
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: "Upload the final package for transfer (stores it for one day)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "macos-package-*"

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify Apple silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Select installed Xcode 26
        shell: bash
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -n 1)"
          test -n "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_PATH/Contents/Developer" swift --version
      - run: npm ci
      - run: npm run test:macos:native-package
      - run: npm run test:macos:native
      - run: npm run test:macos:ui
      - run: npm run test:macos:long-session
      - run: npm run package:macos:native
      - name: Seed inaccessible legacy pairing and provider credentials
        shell: bash
        run: |
          security add-generic-password -U -s com.mathnotes.companion-host -a pairing-token -w legacy-ci-token-not-for-production -T /usr/bin/security
          security add-generic-password -U -s com.mathnotes.provider-api-key -a recognition:mimo_2_5 -w provider-ci-key-not-for-production -T /usr/bin/security
          PROVIDER_JSON='{"providerId":"mimo_2_5","model":"mimo-v2.5","endpoint":"https://api.xiaomimimo.com/v1"}'
          PROVIDER_HEX="$(printf '%s' "$PROVIDER_JSON" | xxd -p | tr -d '\n')"
          defaults write com.mathnotes.native mathnotes.provider.settings.v1 -data "$PROVIDER_HEX"
      - name: Launch packaged app and capture its real window
        run: npm run test:macos:app-launch
      - name: Remove credential fixtures
        if: always()
        shell: bash
        run: |
          security delete-generic-password -s com.mathnotes.companion-host -a pairing-token || true
          security delete-generic-password -s com.mathnotes.provider-api-key -a recognition:mimo_2_5 || true
          defaults delete com.mathnotes.native mathnotes.provider.settings.v1 || true
      - name: Upload native UI acceptance screenshot
        if: github.event_name == 'push' || inputs.upload_artifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MathNotes-macOS-native-ui-acceptance
          path: |
            output/playwright/macos-native-app*.png
            output/playwright/macos-native-phone-connection.png
          if-no-files-found: warn
          retention-days: 1
      - name: Upload final package artifact
        if: github.event_name == 'push' || inputs.upload_artifact == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MathNotes-macOS-native-arm64
          path: |
            output/releases/MathNotes-macOS-native-arm64-*-unsigned.zip
            output/releases/MathNotes-macOS-native-arm64-*-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 1
